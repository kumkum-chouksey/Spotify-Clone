<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="logo.png">
  <title>Spotify - Web Player: Music for Everyone</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@300;400;700;900;&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
  <div class="main">
    <div class="sidebar">

      <div class="navbar">
        <div class="nav-option">
            <i class="fa-solid fa-house"></i>
            <a href="#">Home</a>
        </div>
        <div class="nav-option">
          <i class="fa-solid fa-magnifying-glass"></i>
          <a href="#">Search</a>
        </div>
      </div>

      <div class="libary">
        <div class="libary-first">
          <img class="libary-icon" src="library_icon.png">
          <a class="lib">Library</a>
          <div class="libary-second">
            <div class="lib-one">
              <i class="fa-solid fa-plus"></i>
            </div>
            <div class="lib-two">
              <i class="fa-solid fa-arrow-right"></i>
            </div>
          </div>
        </div>
        <div class="lib-box">
          <div class="box">
            <div class="box1">Create your first playlist</div>
            <div class="box2">it's easy, we'll help you</div>
            <button class="badge">Create playlist</button>
          </div>
          <div class="box">
            <div class="box1">Let's find some podcasts to follow</div>
            <div class="box2">we'll keep you updated on new episodes</div>
            <button class="badge">Browse podcasts</button>
          </div>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="navigation">
        <div class="left">
          <i style="cursor: pointer; margin-right: 8px; margin-left: 13px;" class="fa-solid fa-chevron-left"></i>
          <i style="cursor: pointer;" class="fa-solid fa-chevron-right"></i>
        </div>
        <div class="right">
          <button class="badge">Explore Premium</button>
          <button class="install">
            <i class="fa-regular fa-download"></i>
            Install App
          </button>
          <i style="cursor: pointer;" class="fa-regular fa-user"></i>
        </div>
      </div>
      <div class="album">album</div>
    </div>
    <div class="music-player">music player</div>
  </div>
</body>
</html>
